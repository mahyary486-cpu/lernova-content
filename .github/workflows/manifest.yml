name: Build manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'index.json'
      - 'summaries/**'
      - 'banks/**'
      - 'details/**'
      - 'school_years.json'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the country packs and the manifest
        run: python3 tools/build_manifest.py
      - name: Save the result
        run: |
          git config user.name "lernova-bot"
          git config user.email "lernova-bot@users.noreply.github.com"
          git add manifest.json packs
          if ! git diff --cached --quiet; then
            git commit -m "Update content manifest"
            git pull --rebase
            git push
          fi
